name: sspx-ansp

services:
  ansp:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      STORAGE_DIR: /data/uploads
    volumes:
      # Documentos das solicitações (RG, comprovantes, extratos). Precisa
      # sobreviver ao redeploy e entrar na rotina de backup.
      - uploads:/data/uploads
    networks:
      # `internal`: alcança o Postgres compartilhado (acipec-postgres).
      # `proxy`: exposta ao Traefik, que termina o TLS.
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # O domínio principal, a variante www e o legado permanecem atendidos
      # durante a transição. Os aliases podem ficar iguais ao principal
      # quando não houver endereço anterior a preservar.
      - traefik.http.routers.ansp.rule=Host(`${APP_HOST}`) || Host(`${APP_HOST_WWW}`) || Host(`${APP_HOST_LEGACY}`)
      - traefik.http.routers.ansp.entrypoints=websecure
      - traefik.http.routers.ansp.tls=true
      - traefik.http.routers.ansp.tls.certresolver=letsencrypt
      # Solicita explicitamente um certificado único para o domínio principal
      # e sua variante www; sem estes nomes, o Traefik só emite para o primeiro
      # host da regra do router.
      - traefik.http.routers.ansp.tls.domains[0].main=${APP_HOST}
      - traefik.http.routers.ansp.tls.domains[0].sans=${APP_HOST_WWW}
      - traefik.http.routers.ansp.tls.domains[1].main=${APP_HOST_LEGACY}
      - traefik.http.services.ansp.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    external: true
  proxy:
    external: true

volumes:
  uploads:
