name: sspx-ansp

services:
  ansp:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      STORAGE_DIR: /data/uploads
    volumes:
      # Documentos das solicitações (RG, comprovantes, extratos). Precisa
      # sobreviver ao redeploy e entrar na rotina de backup.
      - uploads:/data/uploads
    networks:
      # `internal`: alcança o Postgres compartilhado (acipec-postgres).
      # `proxy`: exposta ao Traefik, que termina o TLS.
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # O domínio principal e o legado permanecem atendidos durante a
      # transição. APP_HOST_LEGACY pode ficar igual ao principal quando não
      # houver domínio anterior a preservar.
      - traefik.http.routers.ansp.rule=Host(`${APP_HOST}`) || Host(`${APP_HOST_LEGACY}`)
      - traefik.http.routers.ansp.entrypoints=websecure
      - traefik.http.routers.ansp.tls=true
      - traefik.http.routers.ansp.tls.certresolver=letsencrypt
      - traefik.http.services.ansp.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    external: true
  proxy:
    external: true

volumes:
  uploads:
